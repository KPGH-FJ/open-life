<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenLife Phase 3C Static Workbench Mockup</title>
    <link rel="stylesheet" href="./openlife-ui-foundation.css" />
  </head>
  <body>
    <section class="qa-toolbar" aria-label="静态 QA 工具栏" data-qa-only="true">
      <div class="qa-toolbar-label">
        <strong>Phase 3C QA</strong>
        <span>非产品界面</span>
      </div>
      <label class="qa-state-select" for="qaStateSelector">
        <span>Fixture 状态</span>
        <select id="qaStateSelector" aria-label="选择静态 QA fixture"></select>
      </label>
      <p>状态切换仅用于视觉与契约检查</p>
    </section>

    <div class="app-frame">
      <header class="mobile-app-bar" aria-label="移动端应用栏">
        <button
          class="icon-button"
          id="mobileMenuButton"
          type="button"
          aria-label="打开导航"
          aria-controls="mobileNavDrawer"
          aria-expanded="false"
        >
          <span data-static-icon="menu" aria-hidden="true"></span>
        </button>
        <strong>OpenLife</strong>
        <button
          class="mobile-evidence-button"
          id="mobileEvidenceButton"
          type="button"
          aria-label="打开依据与风险"
          aria-controls="evidenceInspector"
          aria-expanded="false"
        >
          <span class="mobile-privacy-dot" id="mobilePrivacyDot" aria-hidden="true"></span>
          <span>依据</span>
        </button>
      </header>

      <div class="workbench-shell" data-component="WorkbenchShell">
        <aside class="sidebar" data-component="SidebarNav" aria-label="OpenLife 主导航">
          <div class="identity-block">
            <div class="identity-mark" aria-hidden="true">OL</div>
            <h1>OpenLife</h1>
          </div>

          <nav class="nav-list" id="sidebarNav" aria-label="产品入口"></nav>

          <footer class="sidebar-footer">
            <button
              class="privacy-status"
              id="privacyStatusButton"
              type="button"
              aria-label="查看模型与隐私边界证据"
            >
              <span class="status-dot" id="privacyStatusDot" aria-hidden="true"></span>
              <span id="privacyStatusLabel">边界未知</span>
            </button>
            <nav
              class="utility-nav-list"
              id="sidebarUtilityNav"
              aria-label="设置入口"
            ></nav>
            <button
              class="nav-item is-support"
              id="supportDetailsButton"
              type="button"
              aria-controls="evidenceInspector"
            >
              <span class="nav-glyph" data-static-icon="terminal" aria-hidden="true"></span>
              <span class="nav-label">支持信息</span>
            </button>
          </footer>
        </aside>

        <main class="main-column" aria-label="主工作区">
          <header class="top-context-bar" data-component="TopContextBar">
            <div class="surface-heading">
              <h2 id="surfaceTitle">载入静态样例</h2>
              <p class="caption" id="surfaceEyebrow">产品工作面</p>
            </div>
            <div
              class="primary-status"
              id="topPrimaryStatus"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            ></div>
          </header>

          <div class="work-surface" id="workSurface" data-component="WorkSurface"></div>
        </main>

        <dialog
          class="inspector"
          id="evidenceInspector"
          data-component="EvidenceInspector"
          aria-label="依据与风险"
          tabindex="-1"
          open
        >
          <div class="inspector-heading">
            <div>
              <p class="caption">检查器</p>
              <h3 id="inspectorTitle">依据与风险</h3>
            </div>
            <span class="context-note is-warning">静态契约样例</span>
            <button
              class="icon-button inspector-close"
              id="inspectorCloseButton"
              type="button"
              aria-label="关闭证据检查器"
            >
              <span data-static-icon="close" aria-hidden="true"></span>
            </button>
          </div>
          <div id="inspectorContent"></div>
        </dialog>
      </div>

      <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="移动端主导航"></nav>

      <div class="mobile-nav-overlay" id="mobileNavOverlay" hidden>
        <button class="overlay-scrim" id="mobileNavScrim" type="button" aria-label="关闭导航"></button>
        <aside
          class="mobile-nav-drawer"
          id="mobileNavDrawer"
          role="dialog"
          aria-modal="true"
          aria-label="全部导航"
        >
          <div class="drawer-heading">
            <strong>全部入口</strong>
            <button class="icon-button" id="mobileNavCloseButton" type="button" aria-label="关闭导航">
              <span data-static-icon="close" aria-hidden="true"></span>
            </button>
          </div>
          <p class="drawer-section-label">主要入口</p>
          <nav class="drawer-nav-list" id="mobileDrawerNav" aria-label="全部产品入口"></nav>
          <div class="drawer-utility-section">
            <p class="drawer-section-label">工具</p>
            <nav
              class="drawer-nav-list"
              id="mobileUtilityNav"
              aria-label="设置入口"
            ></nav>
            <button
              class="nav-item is-support"
              id="mobileSupportDetailsButton"
              type="button"
              aria-controls="evidenceInspector"
            >
              <span class="nav-glyph" data-static-icon="terminal" aria-hidden="true"></span>
              <span class="nav-label">支持信息</span>
            </button>
          </div>
        </aside>
      </div>

    </div>

    <dialog class="action-dialog" id="actionDialog" aria-labelledby="actionDialogTitle">
      <div class="dialog-heading">
        <div>
          <p class="caption">静态交互结果</p>
          <h3 id="actionDialogTitle">动作详情</h3>
        </div>
        <form method="dialog">
          <button class="icon-button" type="submit" aria-label="关闭动作详情">
            <span data-static-icon="close" aria-hidden="true"></span>
          </button>
        </form>
      </div>
      <p id="actionDialogSummary"></p>
      <pre id="actionDialogPayload"></pre>
      <div class="dialog-actions" id="actionDialogActions"></div>
    </dialog>

    <div class="sr-only" id="liveRegion" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript-panel">此静态样例使用本地 JS 渲染固定状态。启用 JavaScript 后可查看。</div>
    </noscript>

    <script src="./mockup-data.js" defer></script>
    <script src="./mockup-app.js" defer></script>
  </body>
</html>
