<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OpenLife Phase 3F UX interaction blueprint and contract-aware static prototype"
    />
    <title>OpenLife Phase 3F - UX Interaction Blueprint</title>
    <link rel="stylesheet" href="openlife-phase3f.css" />
  </head>
  <body>
    <header class="qa-toolbar" aria-label="视觉方案检查工具栏">
      <div class="qa-identity">
        <strong>Phase 3F Interaction QA</strong>
        <span>非产品界面</span>
      </div>
      <label class="qa-selector" for="blueprintSelect">
        <span>交互场景</span>
        <select id="blueprintSelect" aria-label="选择静态交互场景"></select>
      </label>
      <p>Codex / Cursor 白色基线 · 状态转换均为静态 fixture，不代表后端实时结果</p>
    </header>

    <div class="app-viewport" id="appViewport">
      <div class="workbench-shell" id="workbenchShell">
        <aside class="sidebar" aria-label="OpenLife 主导航">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">OL</span>
            <div>
              <strong>OpenLife</strong>
              <span>私人 AI 工作台</span>
            </div>
          </div>

          <nav class="sidebar-nav" id="sidebarNav" aria-label="主要页面"></nav>

          <div class="sidebar-bottom">
            <button
              class="privacy-boundary"
              id="privacyBoundaryButton"
              type="button"
              aria-label="查看模型与传输边界"
            >
              <span class="status-dot is-warning" aria-hidden="true"></span>
              <span>
                <strong id="sidebarPrivacyTitle">传输边界待确认</strong>
                <small id="sidebarPrivacyMeta">未证明全部在本地处理</small>
              </span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
            <nav class="utility-nav" id="utilityNav" aria-label="实用工具"></nav>
          </div>
        </aside>

        <section class="main-column">
          <header class="context-bar">
            <div class="context-leading">
              <button
                class="icon-button mobile-only"
                id="openMobileMenu"
                type="button"
                aria-label="打开导航"
                title="打开导航"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16M4 12h16M4 17h16" />
                </svg>
              </button>
              <div class="context-title-block">
                <div class="context-eyebrow" id="contextEyebrow"></div>
                <h1 id="contextTitle"></h1>
              </div>
            </div>
            <div class="context-actions">
              <span class="primary-status" id="primaryStatus"></span>
              <button
                class="icon-button evidence-trigger"
                id="openInspector"
                type="button"
                aria-label="查看依据与边界"
                title="查看依据与边界"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z" />
                  <circle cx="12" cy="12" r="2.5" />
                </svg>
                <span class="desktop-only">依据</span>
              </button>
            </div>
          </header>

          <main class="work-surface" id="workSurface" tabindex="-1"></main>
        </section>

        <aside
          class="evidence-inspector"
          id="evidenceInspector"
          aria-labelledby="inspectorTitle"
          aria-hidden="true"
        >
          <header class="inspector-header">
            <div>
              <span>依据与边界</span>
              <h2 id="inspectorTitle">当前判断依据</h2>
            </div>
            <button
              class="icon-button"
              id="closeInspector"
              type="button"
              aria-label="关闭依据面板"
              title="关闭"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18" />
              </svg>
            </button>
          </header>
          <div class="inspector-body" id="inspectorBody"></div>
        </aside>

        <div class="inspector-backdrop" id="inspectorBackdrop" hidden></div>

        <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="移动端主导航"></nav>
      </div>
    </div>

    <dialog class="mobile-drawer" id="mobileDrawer" aria-labelledby="drawerTitle">
      <div class="drawer-sheet">
        <header>
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">OL</span>
            <div>
              <strong id="drawerTitle">OpenLife</strong>
              <span>私人 AI 工作台</span>
            </div>
          </div>
          <button
            class="icon-button"
            id="closeMobileMenu"
            type="button"
            aria-label="关闭导航"
            title="关闭"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </header>
        <nav id="mobileDrawerNav" aria-label="全部页面"></nav>
        <div class="drawer-boundary" id="drawerPrivacyBoundary"></div>
        <nav id="mobileUtilityNav" aria-label="实用工具"></nav>
      </div>
    </dialog>

    <dialog class="feedback-dialog" id="feedbackDialog" aria-labelledby="dialogTitle">
      <form method="dialog">
        <div class="dialog-icon" id="dialogIcon" aria-hidden="true"></div>
        <span class="dialog-kicker" id="dialogKicker">静态原型反馈</span>
        <h2 id="dialogTitle"></h2>
        <div class="dialog-body" id="dialogBody"></div>
        <div class="dialog-actions" id="dialogActions"></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="sr-only" id="liveRegion" aria-live="polite" aria-atomic="true"></div>

    <script src="phase3f-data.js"></script>
    <script src="phase3f-app.js"></script>
  </body>
</html>
