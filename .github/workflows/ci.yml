name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # 快速检查（Ubuntu）
  # ============================================
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "openlife-rust"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all --locked -- -D warnings

      - name: Build
        run: cargo check --all --locked

      - name: Run tests
        run: cargo test --all --locked

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        working-directory: frontend
        run: corepack pnpm format:check

      - name: Type check
        working-directory: frontend
        run: corepack pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        run: corepack pnpm build

      - name: Run tests
        working-directory: frontend
        run: corepack pnpm test

  workbench-browser-shell:
    name: Workbench Browser Shell Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run Workbench browser shell smoke
        working-directory: frontend
        run: corepack pnpm test:e2e

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: corepack pnpm test:coverage

  # ============================================
  # 全平台检查（严格模式）
  # ============================================
  rust-check-macos:
    name: Rust Check (macOS)
    runs-on: macos-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "openlife-rust-macos"

      - name: Run tests
        # Main Chat's debug-only async command-surface tests sit too close to
        # Tokio's 2 MiB worker-stack default on GitHub's macOS runner.
        env:
          RUST_MIN_STACK: 4194304
        run: cargo test --all --locked

  rust-check-windows:
    name: Rust Check (Windows)
    runs-on: windows-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "openlife-rust-windows"

      - name: Run core tests
        run: cargo test -p openlife-core --locked

      - name: Compile Tauri lib tests
        run: cargo test -p openlife-tauri --lib --no-run --locked

      - name: Run Tauri binary tests
        run: cargo test -p openlife-tauri --bins --locked

  # ============================================
  # Rust 覆盖率（可选，仅在 main 时运行）
  # ============================================
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage for openlife-core
        # Tarpaulin's default is one minute without a test response. The
        # final-acceptance tests remain bounded but exceed that under ptrace.
        run: cargo tarpaulin -p openlife-core --timeout 300 --out json --output-dir coverage-rust

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-report
          path: coverage-rust/

  # ============================================
  # 依赖安全审计（仅 main 分支）
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: |
          cargo audit --json > cargo-audit.json
          python3 scripts/check-rust-advisory-ownership.py \
            cargo-audit.json plans/openlife_rust_advisory_ownership.json
