name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # 快速检查（Ubuntu）- feature → dev 时使用
  # ============================================
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "openlife-rust"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

      - name: Build
        run: cargo check --all

      - name: Run tests
        run: cargo test --all

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        working-directory: frontend
        run: corepack pnpm exec prettier --check "src/**/*.{ts,tsx}"

      - name: Type check
        working-directory: frontend
        run: corepack pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        run: corepack pnpm build

      - name: Run tests
        working-directory: frontend
        run: corepack pnpm vitest run

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: corepack pnpm vitest run --coverage

      - name: Check coverage threshold
        working-directory: frontend
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | grep -o '"lines":{"total":[0-9]*,"covered":[0-9]*,"skipped":[0-9]*,"pct":[0-9.]*' | grep -o '"pct":[0-9.]*' | cut -d':' -f2)
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below 40% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets 40% threshold"

  # ============================================
  # 全平台检查（严格模式）- dev → main 时使用
  # ============================================
  rust-check-macos:
    name: Rust Check (macOS)
    runs-on: macos-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "openlife-rust-macos"

      - name: Run tests
        run: cargo test --all

  rust-check-windows:
    name: Rust Check (Windows)
    runs-on: windows-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "openlife-rust-windows"

      - name: Run tests
        run: cargo test --all

  # ============================================
  # Rust 覆盖率（可选，仅在 dev → main 时运行）
  # ============================================
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage for openlife-core
        run: cargo tarpaulin -p openlife-core --out json --output-dir coverage-rust

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: coverage-rust/

  # ============================================
  # 依赖安全审计（仅 main 分支）
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  # ============================================
  # 端到端验证
  # ============================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [rust-check, frontend-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Run smoke test
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh

      # NOTE: Playwright E2E tests (frontend/e2e/smoke.spec.ts) are dev-only.
      # They require the Vite dev server + Tauri backend on localhost:5173.
      # See frontend/playwright.config.ts and docs/decisions/e2e-strategy.md
      # for running them locally: `cd frontend && npx playwright test`
