name: Stage 1 Tauri Dogfood

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/stage1-tauri-dogfood.yml"
      - "frontend/**"
      - "src-tauri/**"
      - "openlife-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/stage1-tauri-dogfood.yml"
      - "frontend/**"
      - "src-tauri/**"
      - "openlife-core/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NO_COLOR: 1

jobs:
  stage1-tauri-dogfood:
    name: Retired Stage 1 Tauri Dogfood Contract
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@9.1.0 --activate

      - name: Install frontend dependencies
        run: corepack pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck frontend
        run: corepack pnpm --dir frontend typecheck

      - name: Run retired Stage 1 contract unit tests
        run: corepack pnpm --dir frontend test -- src/stage1BrowserEvidence.test.ts src/tauri.test.ts

      - name: Check retired Stage 1 runner syntax
        run: node --check frontend/scripts/stage1-tauri-webdriver.mjs

      - name: Validate retired Stage 1 static scenario matrix
        run: node frontend/scripts/stage1-tauri-webdriver.mjs --validate-scenarios-only
