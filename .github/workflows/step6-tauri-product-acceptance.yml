name: Step 6 Tauri Product Acceptance

on:
  workflow_dispatch:
    inputs:
      run_external_live:
        description: "Run strict external provider-backed Step 6 live journeys"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/step6-tauri-product-acceptance.yml"
      - "frontend/**"
      - "src-tauri/**"
      - "openlife-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/step6-tauri-product-acceptance.yml"
      - "frontend/**"
      - "src-tauri/**"
      - "openlife-core/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NO_COLOR: 1

jobs:
  step6-tauri-product-acceptance:
    name: Real Tauri Chat UI Step 6 Local Acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Linux Tauri WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            webkit2gtk-driver \
            xvfb \
            dbus-x11

      - name: Enable corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@9.1.0 --activate

      - name: Install frontend dependencies
        run: corepack pnpm --dir frontend install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "openlife-step6-tauri-product-acceptance"

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Typecheck frontend
        run: corepack pnpm --dir frontend typecheck

      - name: Run Step 6 report unit tests
        run: corepack pnpm --dir frontend test -- src/step6ProductAcceptance.test.ts src/stage1BrowserEvidence.test.ts src/tauri.test.ts

      - name: Check Step 6 Tauri WebDriver runner syntax
        run: node --check frontend/scripts/step6-tauri-webdriver.mjs

      - name: Build debug Tauri app binary
        run: cargo build -p openlife-tauri

      - name: Run real Tauri Chat UI Step 6 local acceptance
        run: xvfb-run -a dbus-run-session -- corepack pnpm --dir frontend test:e2e:tauri:step6:local

      - name: Assert local acceptance and blocked live evidence
        run: |
          node -e '
            const fs = require("node:fs");
            const reportPath = "frontend/test-results/main-chat-step6-product-acceptance-report.json";
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const blockers = Array.isArray(report.blockers) ? report.blockers.join(",") : "";
            if (report.evidenceSource !== "tauri_command_surface_step6_browser_observed") {
              throw new Error(`unexpected evidenceSource=${report.evidenceSource} blockers=${blockers}`);
            }
            if (report.e2eEnvironmentReady !== true || report.localDeterministicReady !== true) {
              throw new Error(`local deterministic Step 6 evidence not ready blockers=${blockers}`);
            }
            if (report.acceptanceReady !== false || report.externalLiveReady !== false) {
              throw new Error("local-only CI must not claim complete external live acceptance");
            }
            if (!Array.isArray(report.passedJourneys) || report.passedJourneys.length !== 9) {
              throw new Error(`local passedJourneys count mismatch blockers=${blockers}`);
            }
            if (!Array.isArray(report.blockedLiveJourneys) || report.blockedLiveJourneys.length !== 2) {
              throw new Error(`blocked live journey count mismatch blockers=${blockers}`);
            }
            if (!report.blockedLiveJourneys.includes("S6-LIVE-WEB") || !report.blockedLiveJourneys.includes("S6-LIVE-MCP")) {
              throw new Error(`blocked live journey ids mismatch blockers=${blockers}`);
            }
            if (!Array.isArray(report.failedJourneys) || report.failedJourneys.length !== 0) {
              throw new Error(`failed local journeys present blockers=${blockers}`);
            }
            if (report.noSilentDurableWrite !== true || report.noHiddenLegacyFallback !== true) {
              throw new Error(`safety invariant failed blockers=${blockers}`);
            }
            if (report.noLocalEvidenceCreditedAsExternalLive !== true || report.noInventedUnavailableEvidence !== true) {
              throw new Error(`live/evidence invariant failed blockers=${blockers}`);
            }
            if (report.uiStatusFromStructuredEvidence !== true) {
              throw new Error(`UI status invariant failed blockers=${blockers}`);
            }
          '

      - name: Run real Tauri Chat UI Step 6 strict external live acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_live == true }}
        env:
          OPENLIFE_MAIN_CHAT_LIVE_PROVIDER_EVAL: "1"
          OPENLIFE_LIVE_EVAL_PROVIDER: ${{ vars.OPENLIFE_LIVE_EVAL_PROVIDER }}
          OPENLIFE_LIVE_EVAL_BASE: ${{ vars.OPENLIFE_LIVE_EVAL_BASE }}
          OPENLIFE_LIVE_EVAL_MODEL: ${{ vars.OPENLIFE_LIVE_EVAL_MODEL }}
          OPENLIFE_LIVE_EVAL_API_KEY: ${{ secrets.OPENLIFE_LIVE_EVAL_API_KEY }}
        run: xvfb-run -a dbus-run-session -- corepack pnpm --dir frontend test:e2e:tauri:step6

      - name: Assert strict external live acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_live == true }}
        run: |
          node -e '
            const fs = require("node:fs");
            const reportPath = "frontend/test-results/main-chat-step6-product-acceptance-report.json";
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const blockers = Array.isArray(report.blockers) ? report.blockers.join(",") : "";
            if (report.evidenceSource !== "tauri_command_surface_step6_browser_observed") {
              throw new Error(`unexpected evidenceSource=${report.evidenceSource} blockers=${blockers}`);
            }
            if (report.e2eEnvironmentReady !== true || report.localDeterministicReady !== true) {
              throw new Error(`local deterministic Step 6 evidence not ready blockers=${blockers}`);
            }
            if (report.acceptanceReady !== true || report.externalLiveReady !== true) {
              throw new Error(`strict external live Step 6 evidence not ready blockers=${blockers}`);
            }
            if (!Array.isArray(report.passedJourneys) || report.passedJourneys.length !== 11) {
              throw new Error(`strict passedJourneys count mismatch blockers=${blockers}`);
            }
            if (!Array.isArray(report.blockedLiveJourneys) || report.blockedLiveJourneys.length !== 0) {
              throw new Error(`strict live journeys unexpectedly blocked blockers=${blockers}`);
            }
            if (!Array.isArray(report.failedJourneys) || report.failedJourneys.length !== 0) {
              throw new Error(`strict failed journeys present blockers=${blockers}`);
            }
            if (Array.isArray(report.blockers) && report.blockers.length !== 0) {
              throw new Error(`strict blockers present blockers=${blockers}`);
            }
            if (report.noSilentDurableWrite !== true || report.noHiddenLegacyFallback !== true) {
              throw new Error(`safety invariant failed blockers=${blockers}`);
            }
            if (report.noLocalEvidenceCreditedAsExternalLive !== true || report.noInventedUnavailableEvidence !== true) {
              throw new Error(`live/evidence invariant failed blockers=${blockers}`);
            }
            if (report.uiStatusFromStructuredEvidence !== true) {
              throw new Error(`UI status invariant failed blockers=${blockers}`);
            }
          '

      - name: Run Step 6 Rust final acceptance tests
        run: cargo test -p openlife-tauri main_chat_final_acceptance -- --nocapture

      - name: Upload Step 6 browser evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: step6-tauri-product-acceptance-report
          path: frontend/test-results/main-chat-step6-product-acceptance-report.json
          if-no-files-found: warn
