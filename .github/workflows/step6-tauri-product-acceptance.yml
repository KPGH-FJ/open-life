name: Step 6 Tauri Product Acceptance

on:
  workflow_dispatch:
    inputs:
      run_external_live:
        description: "Run strict external provider-backed Step 6 live journeys"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/step6-tauri-product-acceptance.yml"
      - "frontend/**"
      - "src-tauri/**"
      - "openlife-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/step6-tauri-product-acceptance.yml"
      - "frontend/**"
      - "src-tauri/**"
      - "openlife-core/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NO_COLOR: 1

jobs:
  step6-tauri-product-acceptance:
    name: Retired Step 6 Tauri Acceptance Contract
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@9.1.0 --activate

      - name: Install frontend dependencies
        run: corepack pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck frontend
        run: corepack pnpm --dir frontend typecheck

      - name: Run retired Step 6 contract unit tests
        run: corepack pnpm --dir frontend test -- src/step6ProductAcceptance.test.ts src/stage1BrowserEvidence.test.ts src/tauri.test.ts

      - name: Check retired Step 6 runner syntax
        run: node --check frontend/scripts/step6-tauri-webdriver.mjs

      - name: Validate retired Step 6 static journey matrix
        run: node frontend/scripts/step6-tauri-webdriver.mjs --validate-journeys-only

      - name: Validate retired Step 6 observed rules
        run: node frontend/scripts/step6-tauri-webdriver.mjs --validate-observed-rules-only

      - name: Run retired Step 6 strict external live acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_live == true }}
        run: |
          echo "Step 6 strict external live Tauri acceptance is retired after Phase7 cleanup."
          exit 1
