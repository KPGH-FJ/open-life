name: LifeModel-HS Task
description: Implement exactly one LMHS task from the LifeModel-HS MVP specs.
title: "LMHS-N: Task Title"
labels:
  - lifemodel-hs
  - mvp
  - needs-plan
body:
  - type: markdown
    attributes:
      value: |
        Use this template for one LMHS task at a time.

        For the first Codex pass, require an implementation plan only unless this issue explicitly approves implementation.

  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic
      description: Link the Epic issue.
      placeholder: "#123"
    validations:
      required: true

  - type: dropdown
    id: lmhs_task
    attributes:
      label: LMHS Task
      description: Select the exact task. Do not combine tasks.
      options:
        - "LMHS-1: EvidenceStore MVP Skeleton"
        - "LMHS-2: HeuristicStore MVP Skeleton"
        - "LMHS-3: Policy/Heuristic Boundary And Built-In MVP Assets"
        - "LMHS-4: ContextSelector And HeuristicSelector MVP"
        - "LMHS-5: Deterministic RegressionSuite MVP"
        - "LMHS-6: Runtime Integration MVP"
        - "LMHS-7: Negative Evidence Loop MVP"
        - "LMHS-8: Materialized YAML Compatibility View MVP"
        - "LMHS-9: Minimal Review And Trace Surface"
        - "LMHS-10: Legacy Evolution Path Audit"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Copy or adapt the selected task goal from the specs.
      placeholder: "Introduce..."
    validations:
      required: true

  - type: textarea
    id: required_reading
    attributes:
      label: Required Reading
      value: |
        - `plans/lifemodel_hs_mvp_task_specs.md`
        - `plans/adr/0013-lifemodel-hs-source-of-truth-governance.md`
        - `plans/lifemodel_hs_architecture_plan.md`
        - Relevant existing source files listed in the selected LMHS task.
    validations:
      required: true

  - type: textarea
    id: codex_working_mode
    attributes:
      label: Codex Working Mode
      value: |
        Before editing code:

        1. Read the required documents and relevant existing files.
        2. Summarize the current behavior of the touched modules.
        3. Propose a minimal implementation plan.
        4. Identify risky assumptions.
        5. Only then implement the smallest safe diff.

        During implementation:

        - Stay within Allowed Edit Areas.
        - Keep the change additive.
        - Do not alter unrelated runtime behavior.
        - Add focused tests.
        - Do not introduce new production dependencies unless explicitly justified.
        - Preserve PromptStack, ModelRouter, ToolRuntime, ExecutionFacade, Proposal, and AgentRunEvent governance.

        Before final response / PR:

        - Summarize changed files.
        - Summarize tests run.
        - List remaining risks or follow-ups.
        - Explicitly call out any out-of-scope work avoided.
    validations:
      required: true

  - type: dropdown
    id: first_pass_mode
    attributes:
      label: First Codex Pass
      description: Default to plan-only. Switch only after human review.
      options:
        - "Plan only; do not implement yet"
        - "Implementation approved after plan review"
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Copy the selected task's Expected Behavior section.
    validations:
      required: true

  - type: textarea
    id: data_model_or_integration
    attributes:
      label: Data Model / Integration Sketch
      description: Include minimum schema, struct, enum, event, or packet shape when relevant.
      placeholder: "For LMHS-1, EvidenceRecord should include..."

  - type: textarea
    id: allowed_edit_areas
    attributes:
      label: Allowed Edit Areas
      description: Copy the selected task's Allowed Edit Areas section.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      value: |
        Global non-goals:

        - Do not switch LifeModel source of truth in one step.
        - Do not auto-update identity, values, mission, long-term goals, sensitive relationships, or privacy boundaries.
        - Do not relax privacy policy through heuristics.
        - Do not require LLM-judged regression for MVP acceptance.
        - Do not rewrite ChatPage, AgentRuntime, ContextAssembler, or LifeModelManager broadly.
        - Do not bypass PromptStack, ModelRouter, ToolRuntime, ExecutionFacade, Proposal, or AgentRunEvent governance.
    validations:
      required: true

  - type: textarea
    id: out_of_scope_failure_examples
    attributes:
      label: Out-of-Scope Failure Examples
      value: |
        This issue should be considered off-track if it:

        - Replaces YAML LifeModel as the runtime source of truth.
        - Implements adjacent LMHS tasks without explicit approval.
        - Changes unrelated AgentRuntime selection behavior.
        - Stores raw sensitive payloads in evidence, audit, regression, or selector records unnecessarily.
        - Auto-applies extracted evidence or heuristics to LifeModel.
        - Refactors MemoryStore, VectorStore, ChatPage, AgentRuntime, ContextAssembler, or LifeModelManager broadly.
        - Adds new runtime authority without an accepted ADR.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Copy the selected task's Verification section and include focused existing tests.
      value: |
        Task-specific verification:

        ```bash
        # copy from selected LMHS task
        ```

        Package gate:

        ```bash
        make ci
        ```
    validations:
      required: true

  - type: checkboxes
    id: acceptance
    attributes:
      label: Acceptance Criteria
      options:
        - label: The selected LMHS task's behavior is implemented and tested.
        - label: The change follows ADR 0013.
          required: true
        - label: The change remains additive and proposal-first.
          required: true
        - label: Privacy policy remains a hard boundary.
          required: true
        - label: Runtime/audit records are metadata-safe.
          required: true
        - label: No adjacent LMHS task is implemented accidentally.
          required: true
        - label: Verification commands and results are reported.
          required: true
