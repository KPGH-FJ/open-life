name: Bug Report
description: Report a reproducible bug or regression.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent runtime
        - LifeModel-HS
        - Memory
        - Proposal / Review
        - PromptStack / ModelRouter
        - ToolRuntime / ExecutionSandbox
        - Frontend
        - Tauri commands
        - Build / CI
        - Documentation
        - Unknown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Trace
      description: Paste only redacted logs. Do not include API keys, raw LifeModel, raw memory, private files, or sensitive chat.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I have removed API keys, raw LifeModel content, raw memory, private file contents, and sensitive chat from this report.
          required: true
