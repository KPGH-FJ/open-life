[package]
name = "openlife-a2a-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
default = []
dev-extensions = ["openlife-tauri/dev-extensions"]

[[bin]]
name = "openlife-a2a-server"
path = "src/main.rs"
required-features = ["dev-extensions"]

[dependencies]
axum = "0.7"
openlife-tauri = { path = "../../src-tauri" }
tokio = { version = "1.35", features = ["full"] }

[dev-dependencies]
openlife-core = { path = "../../openlife-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1.0"
tempfile = "3.14"
