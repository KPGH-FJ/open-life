[package]
name = "openlife-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.10"
similar = "2.4"
async-trait = "0.1"
rand = "0.8"
futures = "0.3"
async-stream = "0.3"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tract-onnx = "0.21"
ndarray = "0.16"
aes-gcm = "0.10"
base64 = "0.22"
ring = "0.17"
log = "0.4"
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.14"

[[bench]]
name = "vector_benchmark"
harness = false
